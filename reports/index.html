<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MornInvest 最新日报 | 美股科技晨报</title>
    <meta
      name="description"
      content="MornInvest 每日美股科技晨报归档，覆盖 AI、半导体、云计算、软件和大型科技公司。"
    />
    <style>
      :root {
        --ink: #111827;
        --muted: #5d6678;
        --line: #d9dee8;
        --paper: #f6f3ee;
        --surface: #ffffff;
        --coal: #0c111d;
        --green: #0f766e;
        --blue: #2754c9;
        --red: #b42318;
        --shadow: 0 18px 48px rgba(12, 17, 29, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        line-height: 1.72;
      }

      a {
        color: inherit;
      }

      .top {
        color: #fff;
        background:
          linear-gradient(120deg, rgba(12, 17, 29, 0.96), rgba(15, 118, 110, 0.86)),
          url("../assets/hero-morning-brief.png");
        background-size: cover;
        background-position: center;
      }

      .nav,
      .hero,
      .content,
      footer {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        text-decoration: none;
        font-weight: 800;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.14);
      }

      .nav-links {
        display: flex;
        gap: 20px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
      }

      .nav-links a {
        text-decoration: none;
      }

      .hero {
        padding: 60px 0 70px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #a7f3d0;
        font-size: 14px;
        font-weight: 800;
      }

      h1 {
        max-width: 880px;
        margin: 0;
        font-size: clamp(38px, 6vw, 68px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .hero-copy {
        max-width: 760px;
        margin: 20px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 17px;
      }

      .content {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 28px;
        padding: 38px 0 78px;
        align-items: start;
      }

      .sidebar {
        position: sticky;
        top: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 12px 32px rgba(12, 17, 29, 0.08);
        overflow: hidden;
      }

      .sidebar-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .sidebar-head strong {
        display: block;
        font-size: 16px;
      }

      .sidebar-head span {
        color: var(--muted);
        font-size: 12px;
      }

      .report-list {
        display: grid;
      }

      .report-button {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #e5e9f0;
        padding: 14px 18px;
        color: var(--ink);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .report-button:hover,
      .report-button.active {
        background: #edf7f5;
      }

      .report-button span {
        display: block;
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
      }

      .report-button strong {
        display: block;
        margin-top: 5px;
        font-size: 14px;
        line-height: 1.38;
      }

      .report-button em {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        font-style: normal;
      }

      .report-shell {
        min-width: 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .status {
        color: var(--muted);
        font-size: 14px;
      }

      .copy-button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 14px;
        color: var(--ink);
        background: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .copy-button:hover {
        border-color: #9fb2c8;
      }

      .report {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .report-meta {
        padding: 26px 32px;
        border-top: 5px solid #14b8a6;
        border-bottom: 1px solid var(--line);
        background: #fbfcff;
      }

      .report-meta span {
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .report-meta h2 {
        margin: 8px 0 0;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.18;
      }

      .report-meta p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .report-body {
        padding: 8px 32px 34px;
      }

      .report-body h1 {
        font-size: 30px;
      }

      .report-body h2 {
        margin: 34px 0 14px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        font-size: 22px;
        line-height: 1.28;
      }

      .report-body h3 {
        margin: 26px 0 12px;
        border-left: 4px solid #14b8a6;
        border-radius: 0 8px 8px 0;
        padding: 11px 14px;
        background: #f7fbfa;
        font-size: 18px;
        line-height: 1.35;
      }

      .report-body p {
        margin: 8px 0 18px;
        line-height: 1.72;
      }

      .report-body .mi-field {
        margin: 0 0 14px !important;
      }

      .report-body .mi-field-label {
        margin-bottom: 2px !important;
        color: #64748b !important;
        font-size: 14px !important;
        line-height: 1.35 !important;
      }

      .report-body .mi-field-value {
        display: block;
        color: #18212f;
        font-size: 16px;
        line-height: 1.64;
      }

      .report-body ul,
      .report-body ol {
        padding-left: 22px;
      }

      .report-body li {
        margin: 7px 0;
      }

      .report-body a {
        color: var(--blue);
        text-underline-offset: 3px;
      }

      .report-body table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .report-body th,
      .report-body td {
        border: 1px solid var(--line);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }

      .report-body th {
        background: #eef4f6;
        color: #233044;
      }

      .empty {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
        background: #fff;
        color: var(--muted);
      }

      footer {
        padding: 26px 0;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }
      }

      @media (max-width: 640px) {
        .nav,
        .hero,
        .content,
        footer {
          width: min(100% - 28px, 1180px);
        }

        .nav {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }

        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .report-meta,
        .report-body {
          padding-left: 18px;
          padding-right: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <nav class="nav">
        <a class="brand" href="../index.html">
          <span class="brand-mark">M</span>
          <span>MornInvest</span>
        </a>
        <div class="nav-links">
          <a href="../index.html">首页</a>
          <a href="../index.html#subscribe">订阅</a>
        </div>
      </nav>
      <section class="hero">
        <p class="eyebrow">最新日报</p>
        <h1>每天生成的美股科技晨报，也会同步沉淀到网页端。</h1>
        <p class="hero-copy">
          邮件适合提醒，网页适合阅读、转发和复制。这里默认只展示最新一版 ready 日报，内容来自同一个自动化日报数据库。
        </p>
      </section>
    </header>

    <main class="content">
      <aside class="sidebar" aria-label="最新日报">
        <div class="sidebar-head">
          <strong>最新日报</strong>
          <span id="report-count">正在加载</span>
        </div>
        <div class="report-list" id="report-list"></div>
      </aside>

      <section class="report-shell">
        <div class="toolbar">
          <p class="status" id="status">正在读取最新日报...</p>
          <button class="copy-button" id="copy-button" type="button" disabled>
            复制纯文本
          </button>
        </div>
        <article class="report" id="report" hidden>
          <header class="report-meta">
            <span id="report-kind">Daily Brief</span>
            <h2 id="report-title"></h2>
            <p id="report-date"></p>
          </header>
          <div class="report-body" id="report-body"></div>
        </article>
        <div class="empty" id="empty" hidden>
          暂时没有可展示的 ready 报告。等自动日报生成后，这里会自动出现。
        </div>
      </section>
    </main>

    <footer>
      MornInvest · 中文美股科技晨报 · 本页面仅用于信息整理和研究参考，不构成投资建议。
    </footer>

    <script>
      const state = {
        reports: [],
        selected: null,
      };

      const list = document.querySelector("#report-list");
      const count = document.querySelector("#report-count");
      const status = document.querySelector("#status");
      const empty = document.querySelector("#empty");
      const report = document.querySelector("#report");
      const title = document.querySelector("#report-title");
      const date = document.querySelector("#report-date");
      const kind = document.querySelector("#report-kind");
      const body = document.querySelector("#report-body");
      const copyButton = document.querySelector("#copy-button");

      function formatType(type) {
        return type === "weekly" ? "周报" : "日报";
      }

      function selectReport(reportId, replaceHistory = false) {
        const next = state.reports.find((item) => item.id === reportId);
        if (!next) return;

        state.selected = next;
        title.textContent = next.title || "MornInvest 美股科技晨报";
        date.textContent = `${formatType(next.report_type)} · ${next.report_date || ""}`;
        kind.textContent = next.report_type === "weekly" ? "Weekly Brief" : "Daily Brief";
        body.innerHTML = next.content_html || "";
        report.hidden = false;
        empty.hidden = true;
        copyButton.disabled = false;
        status.textContent = "已加载最新报告。";

        document.querySelectorAll(".report-button").forEach((button) => {
          button.classList.toggle("active", button.dataset.id === reportId);
        });

        const url = new URL(window.location.href);
        url.searchParams.set("id", reportId);
        if (replaceHistory) {
          window.history.replaceState(null, "", url);
        } else {
          window.history.pushState(null, "", url);
        }
      }

      function renderList() {
        list.innerHTML = state.reports
          .map(
            (item) => `
              <button class="report-button" type="button" data-id="${item.id}">
                <span>${formatType(item.report_type)} · ${item.report_date || ""}</span>
                <strong>${item.title || "MornInvest 美股科技晨报"}</strong>
                <em>打开日报全文</em>
              </button>
            `
          )
          .join("");

        list.querySelectorAll(".report-button").forEach((button) => {
          button.addEventListener("click", () => selectReport(button.dataset.id));
        });
      }

      async function loadReports() {
        try {
          const response = await fetch("/api/reports?type=daily&limit=1");
          const result = await response.json();

          if (!response.ok || !result.ok) {
            throw new Error(result.message || "报告读取失败");
          }

          state.reports = result.reports || [];
          count.textContent = state.reports.length ? "当前最新版" : "暂无 ready 日报";

          if (!state.reports.length) {
            status.textContent = "暂无报告。";
            empty.hidden = false;
            report.hidden = true;
            return;
          }

          renderList();
          const requestedId = new URL(window.location.href).searchParams.get("id");
          const firstReport = state.reports.find((item) => item.id === requestedId) || state.reports[0];
          selectReport(firstReport.id, true);
        } catch (error) {
          status.textContent = error.message || "报告读取失败。";
          empty.hidden = false;
          report.hidden = true;
        }
      }

      copyButton.addEventListener("click", async () => {
        if (!state.selected) return;

        try {
          await navigator.clipboard.writeText(state.selected.text_body || "");
          copyButton.textContent = "已复制";
          setTimeout(() => {
            copyButton.textContent = "复制纯文本";
          }, 1600);
        } catch (error) {
          copyButton.textContent = "复制失败";
          setTimeout(() => {
            copyButton.textContent = "复制纯文本";
          }, 1600);
        }
      });

      window.addEventListener("popstate", () => {
        const requestedId = new URL(window.location.href).searchParams.get("id");
        if (requestedId) {
          selectReport(requestedId, true);
        }
      });

      loadReports();
    </script>
  </body>
</html>
