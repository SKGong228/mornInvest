name: MornInvest Send Daily Report

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional YYYY-MM-DD Beijing date"
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_REPORT_MODEL: qwen3.7-plus
      QWEN_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: MornInvest <brief@morninvest.com>
      SEND_ALLOWLIST: ${{ secrets.SEND_ALLOWLIST }}
      REPORT_DATE: ${{ inputs.report_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure daily report exists
        run: node jobs/morning-generate.js
      - name: Send daily report
        run: node jobs/morning-send.js
