name: MornInvest Generate Daily Report

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "35,50 23 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional YYYY-MM-DD Beijing date"
        required: false
        type: string
      force_regenerate:
        description: "Create a fresh report even if one already exists"
        required: false
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_REPORT_MODEL: qwen3.7-plus
      QWEN_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      REPORT_DATE: ${{ inputs.report_date }}
      FORCE_REGENERATE: ${{ inputs.force_regenerate || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate daily report
        run: node jobs/morning-generate.js
