<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MornInvest Admin | 订阅与阅读统计</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        --ink: #111827;
        --muted: #64748b;
        --line: #d9dee8;
        --paper: #f6f3ee;
        --surface: #ffffff;
        --green: #0f766e;
        --red: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 72px;
      }

      .top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1.08;
      }

      .back {
        color: var(--green);
        font-weight: 800;
        text-decoration: none;
      }

      .auth,
      .stats,
      .table-shell {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 12px 34px rgba(12, 17, 29, 0.08);
      }

      .auth {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 16px;
        margin-bottom: 18px;
      }

      input {
        min-width: 0;
        height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 13px;
        color: var(--ink);
        font-size: 14px;
        outline: none;
      }

      input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
      }

      button {
        min-height: 46px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        color: #ffffff;
        background: var(--green);
        font-weight: 800;
        cursor: pointer;
      }

      .status {
        min-height: 24px;
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 14px;
      }

      .status.error {
        color: var(--red);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        margin-bottom: 18px;
        overflow: hidden;
      }

      .stat {
        padding: 18px;
        border-right: 1px solid var(--line);
      }

      .stat:last-child {
        border-right: 0;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .stat strong {
        display: block;
        margin-top: 4px;
        font-size: 28px;
        line-height: 1.1;
      }

      .table-shell {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 11px 13px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        background: #f8fafc;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      code {
        color: #334155;
        font-family: Menlo, Consolas, monospace;
        font-size: 12px;
      }

      .empty {
        padding: 24px;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .top,
        .auth {
          grid-template-columns: 1fr;
          align-items: start;
        }

        .stats {
          grid-template-columns: 1fr 1fr;
        }

        .stat:nth-child(2) {
          border-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <h1>MornInvest 订阅与阅读统计</h1>
          <p class="status">输入管理员密钥后查看当前订阅列表和网页阅读量。</p>
        </div>
        <a class="back" href="../index.html">返回首页</a>
      </div>

      <form class="auth" id="auth-form">
        <input
          id="admin-key"
          type="password"
          placeholder="管理员密钥"
          autocomplete="current-password"
        />
        <button type="submit">查看订阅用户</button>
      </form>

      <p class="status" id="status" aria-live="polite"></p>

      <section class="stats" id="stats" hidden>
        <div class="stat"><span>总记录</span><strong id="total-count">0</strong></div>
        <div class="stat"><span>Active</span><strong id="active-count">0</strong></div>
        <div class="stat"><span>Inactive</span><strong id="inactive-count">0</strong></div>
        <div class="stat"><span>有 Watchlist</span><strong id="watchlist-count">0</strong></div>
      </section>

      <section class="stats" id="analytics-stats" hidden>
        <div class="stat"><span>7日网页阅读</span><strong id="report-views-count">0</strong></div>
        <div class="stat"><span>7日复制正文</span><strong id="report-copies-count">0</strong></div>
        <div class="stat"><span>最近事件数</span><strong id="recent-events-count">0</strong></div>
        <div class="stat"><span>阅读日报数</span><strong id="read-report-count">0</strong></div>
      </section>

      <section class="table-shell" id="analytics-shell" hidden>
        <table>
          <thead>
            <tr>
              <th>日报</th>
              <th>最近 7 天事件数</th>
            </tr>
          </thead>
          <tbody id="report-event-rows"></tbody>
        </table>
      </section>

      <section class="table-shell" id="table-shell" hidden>
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>Status</th>
              <th>Watchlist</th>
              <th>Source</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="subscriber-rows"></tbody>
        </table>
      </section>
    </main>

    <script>
      const form = document.querySelector("#auth-form");
      const keyInput = document.querySelector("#admin-key");
      const status = document.querySelector("#status");
      const stats = document.querySelector("#stats");
      const analyticsStats = document.querySelector("#analytics-stats");
      const analyticsShell = document.querySelector("#analytics-shell");
      const tableShell = document.querySelector("#table-shell");
      const rows = document.querySelector("#subscriber-rows");
      const reportEventRows = document.querySelector("#report-event-rows");

      const totalCount = document.querySelector("#total-count");
      const activeCount = document.querySelector("#active-count");
      const inactiveCount = document.querySelector("#inactive-count");
      const watchlistCount = document.querySelector("#watchlist-count");
      const reportViewsCount = document.querySelector("#report-views-count");
      const reportCopiesCount = document.querySelector("#report-copies-count");
      const recentEventsCount = document.querySelector("#recent-events-count");
      const readReportCount = document.querySelector("#read-report-count");

      function formatDate(value) {
        if (!value) return "";
        return new Intl.DateTimeFormat("zh-CN", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(value));
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderSubscribers(data) {
        const subscribers = data.subscribers || [];
        const reportStats = data.stats || {};

        totalCount.textContent = reportStats.total_count || 0;
        activeCount.textContent = reportStats.active_count || 0;
        inactiveCount.textContent = reportStats.inactive_count || 0;
        watchlistCount.textContent = reportStats.with_watchlist_count || 0;

        rows.innerHTML = subscribers
          .map(
            (subscriber) => `
              <tr>
                <td><strong>${escapeHtml(subscriber.email)}</strong></td>
                <td>${escapeHtml(subscriber.status)}</td>
                <td><code>${escapeHtml(Array.isArray(subscriber.watchlist) ? subscriber.watchlist.join(", ") : "")}</code></td>
                <td>${escapeHtml(subscriber.source)}</td>
                <td>${formatDate(subscriber.created_at)}</td>
              </tr>
            `
          )
          .join("");

        if (!subscribers.length) {
          rows.innerHTML = '<tr><td class="empty" colspan="5">暂无订阅用户。</td></tr>';
        }

        stats.hidden = false;
        tableShell.hidden = false;
      }

      function renderAnalytics(data) {
        const analytics = data.stats || {};
        const reports = analytics.report_counts || [];

        reportViewsCount.textContent = analytics.report_views_7d || 0;
        reportCopiesCount.textContent = analytics.report_copies_7d || 0;
        recentEventsCount.textContent = (analytics.recent_events || []).length || 0;
        readReportCount.textContent = reports.length || 0;

        reportEventRows.innerHTML = reports
          .map(
            (item) => `
              <tr>
                <td><strong>${escapeHtml(item.report)}</strong></td>
                <td>${escapeHtml(item.count)}</td>
              </tr>
            `
          )
          .join("");

        if (!reports.length) {
          reportEventRows.innerHTML = '<tr><td class="empty" colspan="2">暂无阅读数据。</td></tr>';
        }

        analyticsStats.hidden = false;
        analyticsShell.hidden = false;
      }

      async function loadSubscribers(key) {
        status.className = "status";
        status.textContent = "正在读取...";

        const [subscriberResponse, analyticsResponse] = await Promise.all([
          fetch("/api/subscribers", {
            headers: {
              "x-admin-secret": key,
            },
          }),
          fetch("/api/analytics", {
            headers: {
              "x-admin-secret": key,
            },
          }),
        ]);
        const data = await subscriberResponse.json();
        const analyticsData = await analyticsResponse.json();

        if (!subscriberResponse.ok || !data.ok || !data.subscribers) {
          throw new Error(data.message || "读取失败，请检查管理员密钥。");
        }
        if (!analyticsResponse.ok || !analyticsData.ok) {
          throw new Error(analyticsData.message || "统计读取失败，请检查管理员密钥。");
        }

        localStorage.setItem("morninvest_admin_key", key);
        renderSubscribers(data);
        renderAnalytics(analyticsData);
        status.textContent = "已加载订阅用户和阅读统计。";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const key = keyInput.value.trim();

        if (!key) {
          status.className = "status error";
          status.textContent = "请输入管理员密钥。";
          return;
        }

        try {
          await loadSubscribers(key);
        } catch (error) {
          status.className = "status error";
          status.textContent = error.message || "读取失败。";
        }
      });

      const savedKey = localStorage.getItem("morninvest_admin_key");
      if (savedKey) {
        keyInput.value = savedKey;
      }
    </script>
  </body>
</html>
